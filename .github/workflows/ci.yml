name: CI

on:
  push:
    branches:
      - main
      - work/neurotech-redesign-and-game-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate original card catalog
        run: npm run db:import-cards -- --dry-run

      - name: Validate Supabase migration structure
        run: npm run db:validate-migration

      - name: Validate action-card effects and card relationships
        run: npm run db:validate-actions

      - name: Validate online runtime contracts
        run: npm run db:validate-runtime

      - name: Check for exposed service-role credentials
        shell: bash
        run: |
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' src public; then
            echo "A service-role credential must never be committed to frontend files."
            exit 1
          fi

      - name: Check diff whitespace
        run: git diff --check HEAD^1 HEAD

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
